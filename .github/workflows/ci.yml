name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kado
          POSTGRES_PASSWORD: kado
          POSTGRES_DB: kado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kado:kado@localhost:5432/kado_test?schema=public
      AUTH_SECRET: ci-secret-not-used-in-production-000000000000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kado
          POSTGRES_PASSWORD: kado
          POSTGRES_DB: kado_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kado:kado@localhost:5432/kado_e2e?schema=public
      AUTH_SECRET: ci-secret-not-used-in-production-000000000000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # CI gets a fresh database each run, so this is belt and braces — but it
      # keeps the script honest and exercised.
      - run: npm run db:clean-tests
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
