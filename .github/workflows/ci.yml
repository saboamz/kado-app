name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kado
          POSTGRES_PASSWORD: kado
          POSTGRES_DB: kado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kado:kado@localhost:5432/kado_test?schema=public
      AUTH_SECRET: ci-secret-not-used-in-production-000000000000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
