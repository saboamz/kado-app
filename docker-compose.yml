services:
  postgres:
    # pgvector rather than plain postgres: content_vector stores embeddings and
    # queries them by cosine distance, which needs the `vector` type and an
    # HNSW index. The stock postgres image does not ship the extension, and it
    # cannot be added at runtime — it is a compiled module.
    image: pgvector/pgvector:pg16
    container_name: kado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kado
      POSTGRES_PASSWORD: kado
      POSTGRES_DB: kado
    ports:
      - '5432:5432'
    volumes:
      - kado-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kado']
      interval: 5s
      timeout: 5s
      retries: 10

  # Started only with --profile app; day-to-day development runs the server
  # on the host against the postgres above.
  # Applies migrations, then exits. The app waits for it to succeed.
  migrate:
    profiles: ['app']
    build:
      context: .
      target: migrate
    container_name: kado-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kado:kado@postgres:5432/kado

  app:
    profiles: ['app']
    build: .
    container_name: kado-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://kado:kado@postgres:5432/kado
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    ports:
      - '3000:3000'
    volumes:
      # Uploaded images outlive the container: the image is rebuilt on every
      # deploy, and anything written inside it would go with the old one.
      - kado-uploads:/data/uploads

volumes:
  kado-pgdata:
  kado-uploads:
