services:
  postgres:
    image: postgres:16-alpine
    container_name: kado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kado
      POSTGRES_PASSWORD: kado
      POSTGRES_DB: kado
    ports:
      - '5432:5432'
    volumes:
      - kado-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kado']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kado-pgdata:
